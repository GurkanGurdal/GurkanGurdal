name: Katkı yılanını üret

on:
  # Hesaptaki Actions faturalama kilidi kalkınca alttaki iki satırın başındaki # işaretini kaldır:
  # schedule:
  #   - cron: "0 */12 * * *"   # 12 saatte bir güncelle
  workflow_dispatch:          # Actions sekmesinden elle çalıştırılır

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Yılan SVG'lerini oluştur
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#161b22,#3b1f6e,#6d28d9,#a855f7,#f472b6

      - name: output dalına yayınla
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
