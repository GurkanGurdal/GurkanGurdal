name: Profil görsellerini üret

# Katkı yılanını ve istatistik kartını üretip "output" dalına yayınlar.
# README bu daldaki github-snake*.svg ve stats.svg dosyalarını gösterir.

on:
  schedule:
    - cron: "17 */12 * * *"   # 12 saatte bir güncelle
  workflow_dispatch:           # Actions sekmesinden elle de çalıştırılabilir
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Yılan SVG'lerini oluştur
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#161b22,#3b1f6e,#6d28d9,#a855f7,#f472b6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: İstatistik kartını oluştur
        run: |
          pip install --quiet fonttools brotli
          python .github/scripts/profile_stats.py "${{ github.repository_owner }}" dist/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: output dalına yayınla
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
