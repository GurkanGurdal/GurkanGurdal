name: Profil görsellerini üret

# İstatistik kartını ve kapanış animasyonunu üretip "output" dalına yayınlar.
# README bu daldaki stats.svg ve outro.svg dosyalarını gösterir.

on:
  schedule:
    - cron: "17 */12 * * *"   # 12 saatte bir güncelle
  workflow_dispatch:           # Actions sekmesinden elle de çalıştırılabilir
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: İstatistik kartını ve kapanış animasyonunu oluştur
        run: |
          pip install --quiet fonttools brotli
          python .github/scripts/profile_stats.py "${{ github.repository_owner }}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: output dalına yayınla
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
